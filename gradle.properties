version=1.2.0

# Lets Gradle's toolchain detection find the extra JDK that actions/setup-java
# installs for the Javadoc tool; entries whose variable is unset are ignored.
org.gradle.java.installations.fromEnv=JAVA_HOME_25_X64

org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
