name: Integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  broker-integration:
    name: ${{ matrix.broker }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        broker: [apache-kafka-4.3.1, krabka-0.3.8]
    steps:
      - uses: actions/checkout@v6
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - name: Start Apache Kafka 4.3.1
        if: matrix.broker == 'apache-kafka-4.3.1'
        run: |
          docker run -d --name broker -p 9092:9092 \
            -e KAFKA_NODE_ID=1 \
            -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1 \
            -e KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1 \
            -e KAFKA_GROUP_COORDINATOR_REBALANCE_PROTOCOLS=classic,consumer,streams \
            -e KAFKA_GROUP_STREAMS_NUM_STANDBY_REPLICAS=1 \
            -e KAFKA_UNSTABLE_API_VERSIONS_ENABLE=true \
            -e KAFKA_UNSTABLE_FEATURE_VERSIONS_ENABLE=true \
            apache/kafka:4.3.1
          for attempt in $(seq 1 60); do
            if docker logs broker 2>&1 | grep -q 'Kafka Server started'; then
              break
            fi
            sleep 1
          done
          docker logs broker 2>&1 | grep -q 'Kafka Server started'
          docker exec broker /opt/kafka/bin/kafka-features.sh \
            --bootstrap-server localhost:9092 upgrade --feature streams.version=1
      - name: Start krabka 0.3.8
        if: matrix.broker == 'krabka-0.3.8'
        run: |
          docker run -d --name broker -p 9092:9092 --entrypoint /bin/sh \
            ghcr.io/robot-head/crabka-broker:v0.3.8 -c '
              set -eu
              /usr/bin/crabka format \
                --log-dir /tmp/crabka-data \
                --cluster-id 00000000-0000-0000-0000-000000000001 \
                --standalone \
                --node-id 1 \
                --controller-listener 127.0.0.1:9093 \
                --feature streams.version=1
              exec /usr/bin/crabka-broker \
                --listen-addr 0.0.0.0:9092 \
                --advertised-listener localhost:9092 \
                --log-dir /tmp/crabka-data \
                --cluster-id 00000000-0000-0000-0000-000000000001 \
                --metrics-listen-addr none
            '
          for attempt in $(seq 1 60); do
            if docker logs broker 2>&1 | grep -q 'crabka-broker listening'; then
              break
            fi
            sleep 1
          done
          docker logs broker 2>&1 | grep -q 'crabka-broker listening'
      - name: Run broker integration tests
        env:
          KRABKA_INTEGRATION_BOOTSTRAP: localhost:9092
        run: bazel test //krabka-streams-test-utils:integration_tests
      - name: Show broker log
        if: always()
        run: docker logs broker

  schema-registry-integration:
    name: krabka schema registry 0.3.8
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - name: Start krabka broker and schema registry
        run: |
          docker network create krabka-registry-it
          docker run -d --name broker --network krabka-registry-it \
            --entrypoint /bin/sh ghcr.io/robot-head/crabka-broker:v0.3.8 -c '
              set -eu
              /usr/bin/crabka format \
                --log-dir /tmp/crabka-data \
                --cluster-id 00000000-0000-0000-0000-000000000002 \
                --standalone \
                --node-id 1 \
                --controller-listener 127.0.0.1:9093
              exec /usr/bin/crabka-broker \
                --listen-addr 0.0.0.0:9092 \
                --advertised-listener broker:9092 \
                --log-dir /tmp/crabka-data \
                --cluster-id 00000000-0000-0000-0000-000000000002 \
                --metrics-listen-addr none
            '
          for attempt in $(seq 1 60); do
            if docker logs broker 2>&1 | grep -q 'crabka-broker listening'; then
              break
            fi
            sleep 1
          done
          docker logs broker 2>&1 | grep -q 'crabka-broker listening'
          docker run -d --name schema-registry --network krabka-registry-it -p 8081:8081 \
            ghcr.io/robot-head/crabka-schema-registry:v0.3.8 \
            --bootstrap-servers broker:9092 --schemas-topic-rf 1
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:8081/subjects > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://localhost:8081/subjects > /dev/null
      - name: Run schema registry integration test
        env:
          KRABKA_INTEGRATION_SCHEMA_REGISTRY: http://localhost:8081
        run: bazel test //krabka-streams-test-utils:integration_tests
      - name: Show service logs
        if: always()
        run: |
          docker logs broker
          docker logs schema-registry
