name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One Pages deployment at a time; never cancel an in-flight production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          # 25 supplies the javadoc tool for --syntax-highlight; 17, listed last,
          # stays the default JAVA_HOME that Gradle and the compile toolchain use.
          java-version: |
            25
            17
      - uses: gradle/actions/setup-gradle@v6
      - name: Build the documentation site
        run: ./gradlew javadocSite
      - name: Configure GitHub Pages
        # Fails fast with a clear message if Pages is not enabled for the
        # repository (Settings > Pages > Source: GitHub Actions).
        uses: actions/configure-pages@v6
      - name: Upload the site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/javadoc-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
